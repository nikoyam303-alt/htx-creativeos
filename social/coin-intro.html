<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTX 现货交易派对</title>
<style>
@font-face{font-family:Urbanist;src:url("assets/Urbanist-Variable.ttf") format("truetype");font-weight:100 900;font-display:swap}
@font-face{font-family:Harmony;src:url("assets/HarmonyOS-Sans-SC-Light.ttf") format("truetype");font-weight:200 300;font-display:swap}
@font-face{font-family:Harmony;src:url("assets/HarmonyOS-Sans-SC-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:Harmony;src:url("assets/HarmonyOS-Sans-SC-Medium.ttf") format("truetype");font-weight:500 600;font-display:swap}
@font-face{font-family:Harmony;src:url("assets/HarmonyOS-Sans-SC-Bold.ttf") format("truetype");font-weight:700 900;font-display:swap}
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",Harmony,sans-serif;color:#344054;background:#f5f7fb;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;min-width:1080px;background:#f5f7fb;opacity:0;transition:opacity .15s ease}
body.ready{opacity:1}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:398px minmax(720px,1fr);gap:24px;padding:20px;align-items:start}
.panel{background:#fff;border:0;border-radius:12px;box-shadow:none}
.editor{padding:22px;max-height:calc(100vh - 40px);overflow:auto}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.panel-title{font-size:14px;font-weight:400;color:#98a2b3}
.reset{min-height:30px;border:0;border-radius:6px;background:#f4f6f8;color:#7c899b;padding:0 10px;font-size:12px;font-weight:400}
.reset:hover{background:#eaedf1;color:#667085}
.section{padding-top:16px;margin-top:16px;border-top:1px solid #eef1f6}
.section:first-of-type{padding-top:0;margin-top:0;border-top:0}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:#667085;font-size:12px;font-weight:500}
.hint{font-size:11px;font-weight:400;color:#98a2b3}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{min-height:38px;border:0;border-radius:8px;padding:0 10px;background:#f2f4f7;color:#667085;font-size:12px;font-weight:500}
.tab.active{background:#eaf2ff;color:#0f6bff}
.field{margin-top:12px}
.field label{display:block;margin-bottom:6px;color:#667085;font-size:12px;font-weight:400}
.field input,.field textarea{width:100%;border:1px solid #d9e0ea;border-radius:7px;color:#101828;background:#fff;outline:none;font-size:13px;font-weight:400}
.field input{height:42px;padding:0 12px}
.field textarea{min-height:84px;padding:10px 12px;line-height:1.45;resize:vertical}
.field input:focus,.field textarea:focus{border-color:#1677ff;box-shadow:none}
.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.upload-item{position:relative;min-width:0}
.upload-button{width:100%;min-height:58px;display:flex;align-items:center;gap:9px;border:0;border-radius:10px;background:#f8fafc;padding:9px 30px 9px 9px;text-align:left;color:#667085}
.upload-button:hover,.upload-button.drag{background:#edf5ff}
.upload-thumb{width:38px;height:38px;flex:0 0 38px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:#eaf2ff;color:#0f6bff;font-size:20px;font-weight:700}
.upload-thumb img{width:100%;height:100%;object-fit:cover}
.upload-copy{min-width:0}
.upload-copy strong{display:block;color:#344054;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upload-copy span{display:block;font-size:11px;margin-top:2px}
.clear{position:absolute;right:6px;top:6px;width:22px;height:22px;border:0;border-radius:50%;background:#fff;color:#98a2b3;box-shadow:0 1px 5px rgba(16,24,40,.12);display:grid;place-items:center}
.clear:disabled{display:none}
.add-auxiliary{width:100%;min-height:40px;margin-top:9px;border:1px dashed #b9c8dd;border-radius:8px;background:#fff;color:#0f6bff;font-size:12px;font-weight:500}
.add-auxiliary:hover{border-color:#0f6bff;background:#f5f9ff}
.message{min-height:18px;margin-top:12px;color:#d92d20;font-size:12px}
.actions{display:grid;gap:9px;margin-top:16px}
.primary,.secondary{height:46px;border-radius:10px;font-weight:700}
.primary{border:0;background:#0f6bff;color:#fff}
.secondary{border:1px solid #b9c8dd;background:#fff;color:#0f6bff}
.primary:disabled,.secondary:disabled{opacity:.55;cursor:wait}
.preview-panel{padding:22px;min-height:calc(100vh - 40px)}
.preview-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;color:#98a2b3;font-size:13px}
.preview-stage{display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:0 8px 18px}
.canvas-shell{width:min(100%,760px);aspect-ratio:1;box-shadow:0 22px 60px rgba(31,55,92,.18);background:#fff}
canvas{display:block;width:100%;height:100%;image-rendering:auto}
@media(max-width:1240px){body{min-width:980px}.app{grid-template-columns:360px minmax(600px,1fr)}}
</style>
</head>
<body class="ready">
<main class="app">
  <aside class="panel editor">
    <div class="panel-head"><div class="panel-title">文案配置</div><button class="reset" id="resetButton" type="button">清空草稿</button></div>
    <section class="section">
      <div class="section-title">语言版本 <span class="hint">英文 · 简中 · 俄语</span></div>
      <div class="tabs"><button class="tab active" data-lang="en" type="button">EN 英文</button><button class="tab" data-lang="zh" type="button">ZH 简中</button><button class="tab" data-lang="ru" type="button">RU 俄语</button></div>
    </section>
    <section class="section">
      <div class="section-title">主标题 <span class="hint">[] 内文字显示为蓝色</span></div>
      <div class="field"><label for="titleText">主标题（回车换行）</label><textarea id="titleText" data-copy="title" maxlength="160" rows="3" placeholder="例如：[$30,000] Is Up
For Grabs"></textarea></div>
      <div class="field"><label for="subtitleText">副标题（回车换行）</label><textarea id="subtitleText" data-copy="subtitle" maxlength="120" rows="3"></textarea></div>
      <div class="field"><label for="benefit1">权益 1</label><input id="benefit1" data-copy="benefit1" maxlength="30"></div>
      <div class="field"><label for="benefit2">权益 2</label><input id="benefit2" data-copy="benefit2" maxlength="30"></div>
      <div class="field"><label for="benefit3">权益 3</label><input id="benefit3" data-copy="benefit3" maxlength="30"></div>
      <div class="field"><label for="dateText">活动日期</label><input id="dateText" data-copy="date" maxlength="30"></div>
    </section>
    <section class="section">
      <div class="section-title">币种图片 <span class="hint" id="coinCountHint">3 个主币 · 6 个辅助币</span></div>
      <div class="upload-grid" id="uploadGrid"></div>
      <button class="add-auxiliary" id="addAuxiliary" type="button">+ 添加辅助币</button>
      <div class="hint" style="margin-top:10px">支持 PNG / JPG / WebP / SVG，单张不超过 10MB。建议上传透明底高清图。</div>
    </section>
    <div class="message" id="message"></div>
    <div class="actions">
      <button class="primary" id="downloadAll" type="button">下载</button>
    </div>
  </aside>
  <section class="panel preview-panel">
    <div class="preview-head"><span>现货交易派对预览</span><span>1080 × 1080 px · 1× 导出</span></div>
    <div class="preview-stage"><div class="canvas-shell"><canvas id="poster" width="1080" height="1080"></canvas></div></div>
  </section>
</main>
<script>
const ASSET_ROOT="assets/coin-intro/";
const IS_VIP=new URLSearchParams(location.search).get("theme")==="vip";
const BASE_BACKGROUND=ASSET_ROOT+"base-3x.png";
const RIBBON_BACKGROUND=ASSET_ROOT+"ribbon-1x.png";
const VIP_UNION=ASSET_ROOT+"vip-union.svg?v=202608191030";
const VIP_BADGE=ASSET_ROOT+"vip-badge.svg?v=202608191030";
const LANGUAGES=["en","zh","ru"];
const LOGOS={en:ASSET_ROOT+"htx-en.svg?v=202608182210",zh:ASSET_ROOT+"htx-zh.svg?v=202608182210",ru:ASSET_ROOT+"htx-en.svg?v=202608182210"};
const DRAFT_KEY=IS_VIP?"htx-spot-carnival-vip-v1":"htx-spot-carnival-v1";
const DB_NAME=IS_VIP?"htx-spot-carnival-vip-assets":"htx-spot-carnival-assets";
const STORE_NAME="coins";
const MAIN_COIN_COUNT=3;
const DEFAULT_AUXILIARY_COUNT=6;
const emptyCoin=()=>({src:"",name:""});
const STANDARD_DEFAULTS={
  en:{
    title:"[$30,000] Is Up\nFor Grabs",
    subtitle:"Spot Trading Carnival\nTrade Now to Claim Your Share",
    benefit1:"New User Bonus",benefit2:"Grid Trading Rewards",benefit3:"SVIP Incentive",date:"July 2 - July 9"
  },
  zh:{
    title:"现货交易派对\n[$30,000] 奖励派送中",
    subtitle:"马上加入赢取奖励",
    benefit1:"新人专属空投",benefit2:"网格加码",benefit3:"SVIP激励升级",date:"7月2日 - 7月9日"
  },
  ru:{
    title:"Спотовая торговая вечеринка\n[$30 000] ждут победителей",
    subtitle:"Торгуйте сейчас и получите свою долю",
    benefit1:"Бонус для новичков",benefit2:"Награды за grid-торговлю",benefit3:"Бонус для SVIP",date:"2–9 июля"
  }
};
const VIP_DEFAULTS={
  en:{
    title:"$10,000 trading\nincentives exclusive\nfor SVIPs",
    subtitle:"Spot Trading Carnival · Premium Trading Experience",
    benefit1:"Top trader wins $2,800 alone",benefit2:"Register to secure your exclusive\ntrading benefits",benefit3:"",date:"July 2 - July 9"
  },
  zh:{
    title:"SVIP 独领\n$10,000 专项加码",
    subtitle:"现货交易派对 · 顶级交易尊享盛宴",
    benefit1:"冲击榜首独享$2,800奖励",benefit2:"报名开启您的 专属交易特权",benefit3:"",date:"7月2日 - 7月9日"
  },
  ru:{
    title:"Торговые бонусы\n$10 000 эксклюзивно\nдля SVIP",
    subtitle:"Спотовая торговая вечеринка · Премиальный трейдинг",
    benefit1:"Лучший трейдер получит $2 800",benefit2:"Зарегистрируйтесь, чтобы получить\nэксклюзивные торговые преимущества",benefit3:"",date:"2–9 июля"
  }
};
const defaults=IS_VIP?VIP_DEFAULTS:STANDARD_DEFAULTS;
const EXPORT_PREFIX=IS_VIP?"现货交易派对-VIP":"现货交易派对";
let state={language:"en",copy:structuredClone(defaults),coins:Array.from({length:MAIN_COIN_COUNT+DEFAULT_AUXILIARY_COUNT},emptyCoin)};
const imageCache=new Map();
let renderSequence=0;
const undoStack=[];
const MAX_UNDO_STEPS=60;

function snapshotState(){return structuredClone(state)}
function recordHistory(){
  const snapshot=snapshotState(),last=undoStack.at(-1);
  if(last&&JSON.stringify(last)===JSON.stringify(snapshot))return;
  undoStack.push(snapshot);
  if(undoStack.length>MAX_UNDO_STEPS)undoStack.shift();
}
async function persistAllCoins(){
  try{
    const db=await openDb();
    await new Promise((resolve,reject)=>{const tx=db.transaction(STORE_NAME,"readwrite"),store=tx.objectStore(STORE_NAME);store.clear();state.coins.forEach((coin,index)=>{if(coin.src)store.put({index,...coin})});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
    db.close();
  }catch(_){setMessage("已撤销，但浏览器未能同步图片草稿。")}
}
async function undoLastAction(){
  const previous=undoStack.pop();
  if(!previous)return;
  state=structuredClone(previous);
  saveDraft();
  await persistAllCoins();
  renderCopyEditor();renderUploads();renderPoster();
  setMessage("已返回上一步操作。")
}

function legacyLineToMarkup(line){
  if(!line)return "";
  return [line.before,line.accent?`[${line.accent}]`:"",line.after].filter(Boolean).join(" ");
}
function loadDraft(){
  try{
    const saved=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");
    if(!saved)return;
    state.language=LANGUAGES.includes(saved.language)?saved.language:"en";
    if(Number.isInteger(saved.auxiliaryCount)&&saved.auxiliaryCount>=0)state.coins=Array.from({length:MAIN_COIN_COUNT+saved.auxiliaryCount},emptyCoin);
    for(const lang of LANGUAGES){
      const copy=saved.copy?.[lang];
      if(!copy)continue;
      state.copy[lang].title=typeof copy.title==="string"?copy.title:[legacyLineToMarkup(copy.line1),legacyLineToMarkup(copy.line2)].filter(Boolean).join("\n")||state.copy[lang].title;
      state.copy[lang].subtitle=typeof copy.subtitle==="string"?copy.subtitle:[copy.subtitle1,copy.subtitle2].filter(Boolean).join("\n")||state.copy[lang].subtitle;
      for(const key of ["benefit1","benefit2","benefit3","date"]){if(typeof copy[key]==="string")state.copy[lang][key]=copy[key]}
    }
  }catch(_){}
}
function saveDraft(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify({language:state.language,copy:state.copy,auxiliaryCount:state.coins.length-MAIN_COIN_COUNT}))}catch(_){}}
function openDb(){return new Promise((resolve,reject)=>{const request=indexedDB.open(DB_NAME,1);request.onupgradeneeded=()=>request.result.createObjectStore(STORE_NAME,{keyPath:"index"});request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
async function restoreCoins(){try{const db=await openDb();const records=await new Promise((resolve,reject)=>{const request=db.transaction(STORE_NAME).objectStore(STORE_NAME).getAll();request.onsuccess=()=>resolve(request.result||[]);request.onerror=()=>reject(request.error)});db.close();records.forEach(item=>{if(state.coins[item.index])state.coins[item.index]={src:item.src||"",name:item.name||""}})}catch(_){}}
async function persistCoin(index){try{const db=await openDb();await new Promise((resolve,reject)=>{const tx=db.transaction(STORE_NAME,"readwrite");tx.objectStore(STORE_NAME).put({index,...state.coins[index]});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}catch(_){setMessage("图片可正常使用，但浏览器未能保存这张图片草稿。")}}
async function deleteCoin(index){try{const db=await openDb();await new Promise((resolve,reject)=>{const tx=db.transaction(STORE_NAME,"readwrite");tx.objectStore(STORE_NAME).delete(index);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}catch(_){}}
async function clearCoins(){try{const db=await openDb();await new Promise((resolve,reject)=>{const tx=db.transaction(STORE_NAME,"readwrite");tx.objectStore(STORE_NAME).clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}catch(_){}}
function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]))}
function setMessage(message=""){document.getElementById("message").textContent=message}
function configureThemeUI(){
  if(!IS_VIP)return;
  document.title="HTX 现货交易派对 VIP";
  document.querySelector(".preview-head span").textContent="现货交易派对 VIP 预览";
  document.querySelector('label[for="subtitleText"]').textContent="顶部说明（回车换行）";
  document.querySelector('label[for="benefit1"]').textContent="蓝色卖点";
  document.querySelector('label[for="benefit2"]').textContent="底部说明（回车换行）";
  document.getElementById("benefit3").closest(".field").hidden=true;
  document.getElementById("titleText").rows=4;
}
function renderCopyEditor(){
  document.querySelectorAll("[data-lang]").forEach(button=>button.classList.toggle("active",button.dataset.lang===state.language));
  const copy=state.copy[state.language];
  document.querySelectorAll("[data-copy]").forEach(input=>input.value=copy[input.dataset.copy]);
}
function renderUploads(){
  const auxiliaryCount=state.coins.length-MAIN_COIN_COUNT;
  document.getElementById("coinCountHint").textContent=`${MAIN_COIN_COUNT} 个主币 · ${auxiliaryCount} 个辅助币`;
  document.getElementById("uploadGrid").innerHTML=state.coins.map((coin,index)=>`<div class="upload-item">
    <button class="upload-button" data-upload="${index}" type="button"><span class="upload-thumb">${coin.src?`<img src="${escapeHtml(coin.src)}" alt="">`:"+"}</span><span class="upload-copy"><strong>${escapeHtml(coin.name||((index<MAIN_COIN_COUNT?"主币 ":"辅助币 ")+(index<MAIN_COIN_COUNT?index+1:index-MAIN_COIN_COUNT+1)))}</strong><span>点击或拖拽上传</span></span></button>
    ${index<MAIN_COIN_COUNT?`<button class="clear" data-clear="${index}" type="button" ${coin.src?"":"disabled"} aria-label="清除主币 ${index+1}">×</button>`:`<button class="clear" data-remove="${index}" type="button" aria-label="删除辅助币 ${index-MAIN_COIN_COUNT+1}">×</button>`}
    <input type="file" hidden data-file="${index}" accept=".png,.jpg,.jpeg,.webp,.svg,image/png,image/jpeg,image/webp,image/svg+xml">
  </div>`).join("");
  document.querySelectorAll("[data-upload]").forEach(button=>{
    const index=Number(button.dataset.upload),input=document.querySelector(`[data-file="${index}"]`);
    button.addEventListener("click",()=>input.click());
    for(const type of ["dragenter","dragover"])button.addEventListener(type,event=>{event.preventDefault();button.classList.add("drag")});
    for(const type of ["dragleave","drop"])button.addEventListener(type,event=>{event.preventDefault();button.classList.remove("drag")});
    button.addEventListener("drop",event=>applyCoin(index,event.dataTransfer?.files?.[0]));
    input.addEventListener("change",event=>{applyCoin(index,event.target.files?.[0]);event.target.value=""});
  });
  document.querySelectorAll("[data-clear]").forEach(button=>button.addEventListener("click",async()=>{const index=Number(button.dataset.clear);recordHistory();state.coins[index]={src:"",name:""};await deleteCoin(index);renderUploads();renderPoster()}));
  document.querySelectorAll("[data-remove]").forEach(button=>button.addEventListener("click",async()=>{const index=Number(button.dataset.remove);recordHistory();state.coins.splice(index,1);saveDraft();await persistAllCoins();renderUploads();renderPoster()}));
}
function applyCoin(index,file){
  if(!file)return;
  const valid=/\.(png|jpe?g|webp|svg)$/i.test(file.name)||["image/png","image/jpeg","image/webp","image/svg+xml"].includes(file.type);
  if(!valid){setMessage("仅支持 PNG、JPG、WebP 或 SVG 文件。");return}
  if(file.size>10*1024*1024){setMessage("单张图片不能超过 10MB。");return}
  const reader=new FileReader();reader.onload=async()=>{recordHistory();state.coins[index]={src:String(reader.result),name:file.name};imageCache.delete(state.coins[index].src);setMessage();renderUploads();renderPoster();await persistCoin(index)};reader.onerror=()=>setMessage("图片读取失败，请重新选择。");reader.readAsDataURL(file);
}
function loadImage(src){if(imageCache.has(src))return imageCache.get(src);const promise=new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=src});imageCache.set(src,promise);return promise}
function fontFor(language,size,weight=500){return `${weight} ${size}px ${language==="zh"?'Harmony,"PingFang SC",sans-serif':'Urbanist,Arial,sans-serif'}`}
function fitSegments(ctx,segments,maxWidth,maxSize,minSize,language,weight){for(let size=maxSize;size>=minSize;size-=1){ctx.font=fontFor(language,size,weight);if(segments.reduce((sum,item)=>sum+ctx.measureText(item.text).width,0)<=maxWidth)return size}return minSize}
function drawSegments(ctx,segments,x,y,maxWidth,maxSize,minSize,language,weight,normalColor="#000",accentColor="#0f6bff"){const size=fitSegments(ctx,segments,maxWidth,maxSize,minSize,language,weight);ctx.font=fontFor(language,size,weight);ctx.textBaseline="top";for(const item of segments){ctx.fillStyle=item.accent?accentColor:normalColor;ctx.fillText(item.text,x,y);x+=ctx.measureText(item.text).width}return size}
function parseHighlightedLine(text){
  const items=[];let cursor=0;const pattern=/\[([^\]\n]+)\]/g;let match;
  while((match=pattern.exec(text))){if(match.index>cursor)items.push({text:text.slice(cursor,match.index),accent:false});items.push({text:match[1],accent:true});cursor=pattern.lastIndex}
  if(cursor<text.length)items.push({text:text.slice(cursor),accent:false});
  return items;
}
function drawBenefit(ctx,language,index,text,y){const x=language==="zh"?75:87;ctx.save();ctx.strokeStyle=language==="zh"?"#000":"#666";ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+23,y+23,23,0,Math.PI*2);ctx.stroke();ctx.fillStyle=language==="zh"?"#000":"#565b63";ctx.font=fontFor(language,31,400);ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(String(index),x+23,y+24);ctx.textAlign="left";ctx.textBaseline="top";ctx.font=fontFor(language,language==="zh"?29:27,400);ctx.fillText(text,x+62,y+7);ctx.restore()}
function drawPlaceholder(ctx,x,y,size,label){ctx.save();ctx.fillStyle="rgba(255,255,255,.58)";ctx.beginPath();ctx.arc(x+size/2,y+size/2,size/2-2,0,Math.PI*2);ctx.fill();ctx.fillStyle="rgba(15,107,255,.7)";ctx.font=`600 ${Math.max(13,size/8)}px Urbanist,Arial`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(label,x+size/2,y+size/2);ctx.restore()}
function drawCircularImage(ctx,image,x,y,size){const width=image.naturalWidth||image.width,height=image.naturalHeight||image.height,side=Math.min(width,height),sx=(width-side)/2,sy=(height-side)/2;ctx.save();ctx.beginPath();ctx.arc(x+size/2,y+size/2,size/2,0,Math.PI*2);ctx.clip();ctx.drawImage(image,sx,sy,side,side,x,y,size,size);ctx.restore()}
async function drawCoins(ctx,showPlaceholders,vip=false){
  const mainSlots=vip?[
    {x:775.5,y:425.691,size:241.5,label:"主币 1"},{x:534,y:667.191,size:241.5,label:"主币 2"},{x:775.5,y:667.191,size:241.5,label:"主币 3"}
  ]:[
    {x:794.5,y:478,size:228.5,label:"主币 1"},{x:566,y:706.5,size:228.5,label:"主币 2"},{x:794.5,y:706.5,size:228.5,label:"主币 3"}
  ];
  const auxiliaryCount=Math.max(0,state.coins.length-MAIN_COIN_COUNT);
  const rowRight=vip?1017.5:1022.5,rowLeft=vip?64:300,rowY=vip?943.333:947,preferredSize=vip?68.149:64.48;
  const availableWidth=rowRight-rowLeft;
  const gap=auxiliaryCount?Math.min(14,availableWidth/(auxiliaryCount*4)):0;
  const auxiliarySize=auxiliaryCount?Math.min(preferredSize,(availableWidth-gap*(auxiliaryCount-1))/auxiliaryCount):0;
  const slots=[...mainSlots,...Array.from({length:auxiliaryCount},(_,i)=>({x:rowRight-auxiliarySize-i*(auxiliarySize+gap),y:rowY,size:auxiliarySize,label:String(i+1)}))];
  const images=await Promise.all(state.coins.map(coin=>coin.src?loadImage(coin.src).catch(()=>null):null));
  slots.forEach((slot,index)=>{if(images[index])drawCircularImage(ctx,images[index],slot.x,slot.y,slot.size);else if(showPlaceholders)drawPlaceholder(ctx,slot.x,slot.y,slot.size,slot.label)});
}
async function drawPoster(language,target,showPlaceholders=true,scale=1){
  const sequence=++renderSequence;
  const ctx=target.getContext("2d");
  target.width=1080*scale;target.height=1080*scale;ctx.setTransform(scale,0,0,scale,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
  const assets=await Promise.all(IS_VIP?[loadImage(BASE_BACKGROUND),loadImage(VIP_UNION),loadImage(VIP_BADGE)]:[loadImage(BASE_BACKGROUND),loadImage(RIBBON_BACKGROUND),loadImage(LOGOS[language])]);
  if(sequence!==renderSequence&&target.id==="poster")return;
  if(IS_VIP){
    const [baseBackground,vipUnion,vipBadge]=assets,copy=state.copy[language],isZh=language==="zh",brown="#543d0e",blue="#086bff";
    ctx.drawImage(baseBackground,0,0,1080,1080);
    ctx.save();ctx.globalCompositeOperation="luminosity";ctx.drawImage(vipUnion,-103.471,782,983.383,298.001);ctx.restore();
    ctx.drawImage(vipBadge,930,50,100,100);
    const titleLines=copy.title.replace(/\r/g,"").split("\n").slice(0,3),titleX=isZh?69:50,titleY=isZh?154:137,titleGap=isZh?108:88;
    titleLines.forEach((line,index)=>drawSegments(ctx,parseHighlightedLine(line),titleX,titleY+index*titleGap,isZh?860:810,isZh?98:90,48,language,isZh?750:700,brown,blue));
    const topLines=copy.subtitle.replace(/\r/g,"").split("\n").slice(0,2);topLines.forEach((line,index)=>drawSegments(ctx,parseHighlightedLine(line),isZh?69:50,(isZh?84:65)+index*(isZh?45:35),isZh?790:700,isZh?38:28,20,language,isZh?500:400,brown,blue));
    const sellingLines=copy.benefit1.replace(/\r/g,"").split("\n").slice(0,2);sellingLines.forEach((line,index)=>drawSegments(ctx,parseHighlightedLine(line),isZh?69:50,(isZh?410:428)+index*(isZh?50:42),isZh?520:500,isZh?40:35,24,language,400,blue,blue));
    ctx.fillStyle=brown;ctx.globalAlpha=.6;ctx.font=fontFor(language,isZh?29:25,400);ctx.textBaseline="top";ctx.fillText(copy.date,isZh?69:56,isZh?912:912);
    const footerLines=copy.benefit2.replace(/\r/g,"").split("\n").slice(0,2);footerLines.forEach((line,index)=>{ctx.font=fontFor(language,isZh?29:25,400);ctx.fillText(line,isZh?69:56,(isZh?958:942)+index*(isZh?40:29))});ctx.globalAlpha=1;
    await drawCoins(ctx,showPlaceholders,true);
    return;
  }
  const [baseBackground,ribbonBackground,logo]=assets;
  ctx.drawImage(baseBackground,0,0,1080,1080);ctx.drawImage(ribbonBackground,0,88.795,1080,991.205);
  const copy=state.copy[language],isZh=language==="zh";
  const titleLines=copy.title.replace(/\r/g,"").split("\n").slice(0,2),line1=parseHighlightedLine(titleLines[0]||""),line2=parseHighlightedLine(titleLines[1]||"");
  drawSegments(ctx,line1,isZh?73:87,isZh?78:77,isZh?930:760,isZh?91:102,44,language,750);
  drawSegments(ctx,line2,isZh?73:87,isZh?191:180,isZh?940:760,isZh?91:102,44,language,750);
  const subtitleLines=copy.subtitle.replace(/\r/g,"").split("\n").slice(0,2);ctx.fillStyle="#000";ctx.font=fontFor(language,isZh?38:41,400);ctx.textBaseline="top";ctx.fillText(subtitleLines[0]||"",isZh?79:87,isZh?341:310);if(subtitleLines[1])ctx.fillText(subtitleLines[1],isZh?79:87,isZh?388:359);
  const benefitTop=isZh?433:480,benefitGap=isZh?65:69;
  [copy.benefit1,copy.benefit2,copy.benefit3].forEach((text,index)=>drawBenefit(ctx,language,index+1,text,benefitTop+index*benefitGap));
  const dateX=isZh?75:87,dateY=isZh?691:703,dateH=isZh?58:66;ctx.font=fontFor(language,isZh?27:29,500);const dateWidth=Math.min(470,Math.max(isZh?253:270,ctx.measureText(copy.date).width+78));ctx.fillStyle="#0f6bff";ctx.beginPath();ctx.roundRect(dateX,dateY,dateWidth,dateH,16);ctx.fill();ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(copy.date,dateX+dateWidth/2,dateY+dateH/2+1);ctx.textAlign="left";
  await drawCoins(ctx,showPlaceholders);
  ctx.drawImage(logo,isZh?73:87,940,isZh?149:183,70);
}
function renderPoster(){return drawPoster(state.language,document.getElementById("poster"),true,1).catch(()=>setMessage("模板素材加载失败，请刷新后重试。"))}
function canvasBlob(canvas){return new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error("生成失败")),"image/png"))}
function triggerBlob(blob,name){const url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
async function buildLanguage(language){const canvas=document.createElement("canvas");await drawPoster(language,canvas,false,1);return canvasBlob(canvas)}
async function downloadCurrent(){const button=document.getElementById("downloadCurrent"),label=button.textContent;button.disabled=true;button.textContent="正在生成 1× PNG…";setMessage();try{triggerBlob(await buildLanguage(state.language),`${EXPORT_PREFIX}-${state.language}-1x.png`)}catch(error){setMessage(error.message||"导出失败，请重试。")}finally{button.disabled=false;button.textContent=label;renderPoster()}}
async function downloadAll(){const button=document.getElementById("downloadAll"),label=button.textContent;button.disabled=true;button.textContent="正在生成三语 1×…";setMessage();try{const zipCtor=window.parent!==window?window.parent.JSZip:null;if(!zipCtor)throw new Error("打包组件尚未加载，请使用当前语种导出。");const zip=new zipCtor();for(const language of LANGUAGES)zip.file(`${EXPORT_PREFIX}-${language}-1x.png`,await buildLanguage(language));triggerBlob(await zip.generateAsync({type:"blob"}),`${EXPORT_PREFIX}-三语-1x.zip`)}catch(error){setMessage(error.message||"导出失败，请重试。")}finally{button.disabled=false;button.textContent=label;renderPoster()}}
document.querySelectorAll("[data-lang]").forEach(button=>button.addEventListener("click",()=>{state.language=button.dataset.lang;saveDraft();renderCopyEditor();renderPoster()}));
document.querySelectorAll("[data-copy]").forEach(input=>input.addEventListener("input",()=>{recordHistory();state.copy[state.language][input.dataset.copy]=input.value;saveDraft();renderPoster()}));
document.getElementById("downloadAll").addEventListener("click",downloadAll);
document.getElementById("addAuxiliary").addEventListener("click",()=>{recordHistory();state.coins.push(emptyCoin());saveDraft();renderUploads();renderPoster()});
document.getElementById("resetButton").addEventListener("click",async()=>{recordHistory();const emptyCopy=Object.fromEntries(LANGUAGES.map(language=>[language,Object.fromEntries(Object.keys(defaults[language]).map(key=>[key,""]))]));state={language:state.language,copy:emptyCopy,coins:Array.from({length:MAIN_COIN_COUNT+DEFAULT_AUXILIARY_COUNT},emptyCoin)};localStorage.removeItem(DRAFT_KEY);await clearCoins();renderCopyEditor();renderUploads();renderPoster();setMessage("草稿已清空，可按 Command + Z 撤销。");});
document.addEventListener("keydown",event=>{if(event.metaKey&&!event.shiftKey&&event.key.toLowerCase()==="z"){event.preventDefault();undoLastAction()}});
async function initialize(){configureThemeUI();loadDraft();const themeAssets=IS_VIP?[loadImage(VIP_UNION),loadImage(VIP_BADGE)]:[loadImage(RIBBON_BACKGROUND),...[...new Set(Object.values(LOGOS))].map(loadImage)];await Promise.allSettled([restoreCoins(),document.fonts.ready,loadImage(BASE_BACKGROUND),...themeAssets]);renderCopyEditor();renderUploads();await renderPoster();document.body.classList.add("ready")}
initialize();
