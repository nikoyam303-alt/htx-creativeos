.coin-list{display:grid;gap:12px}.coin-card{padding:14px;border:1px solid #e4e7ec;border-radius:10px;background:#fff}.coin-title{margin-bottom:11px;color:#344054;font-size:12px;font-weight:600}.input-field{display:block;margin-bottom:11px}.input-field span,.upload-label{display:block;margin-bottom:6px;color:#667085;font-size:10px}.input-field input{width:100%;height:38px;padding:0 10px;border:1px solid #dde3ea;border-radius:7px;color:#111827;background:#fff;outline:none}.input-field input:focus{border-color:#0066ff;box-shadow:0 0 0 3px rgba(0,102,255,.08)}

.brand{position:absolute;left:50px;top:50px;width:90px;height:90px;z-index:6}.single-title{position:absolute;left:50px;top:526px;width:680px;height:348px;display:flex;flex-direction:column;justify-content:center;color:#000;font-family:Urbanist,Arial,sans-serif;font-size:181.463px;font-weight:500;line-height:.96;letter-spacing:-.045em;text-transform:uppercase;white-space:nowrap;z-index:5}.single-title span,.multi-title span{display:block}.single-short{position:absolute;left:60px;top:899px;color:#3b3b3b;font-size:40px;font-weight:300;white-space:nowrap;z-index:5}.multi-title{position:absolute;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;color:#000;font-family:Urbanist,Arial,sans-serif;font-size:41px;font-weight:500;line-height:.96;letter-spacing:-.025em;text-transform:uppercase;white-space:nowrap;z-index:5}.multi-short{position:absolute;display:flex;align-items:center;color:#3b3b3b;font-size:34px;font-weight:300;white-space:nowrap;z-index:5}.count-4 .multi-short{font-size:28px}.divider{position:absolute;height:.6px;background:rgba(0,0,0,.5);z-index:5}.poster-footer{position:absolute;left:50px;top:1163px;width:650px;height:44px;font-size:36px;font-weight:300;line-height:1.21;white-space:nowrap;z-index:6}.count-3 .poster-footer,.count-4 .poster-footer{top:1169px}
@media(max-width:720px){body{padding:14px}.workbench{grid-template-columns:1fr;height:auto}.panel{height:auto;max-height:none}.preview{height:700px}.stage{min-height:0}}@media(max-width:520px){body{padding:8px}.preview{height:580px}.stage{padding:12px}.preview-head{padding:0 14px}}

<body>
<main class="workbench">

    <div class="stage" id="stage"><div class="poster-mount" id="posterMount"><article class="poster count-1" id="poster"></article></div></div>
  </section>
</main>
<script>
const EMPTY='data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
const DRAFT_KEY='htx-contract-listing-v1';
const LAYOUTS={
  1:{orbits:[{left:473,top:50,width:600,height:600}],artworks:[{left:573,top:150,width:400,height:400}],glass:{left:-68,top:397,width:846,height:700,cut:68},rows:[],dividers:[]},
  2:{orbits:[{left:620,top:119,width:540,height:540},{left:620,top:586,width:540,height:537}],artworks:[{left:712,top:211,width:357,height:357},{left:712,top:676,width:357,height:357}],glass:{left:-125,top:229,width:858,height:820,cut:125},rows:[{title:{left:51,top:364,width:520,height:79},short:{left:60,top:478.5,width:500,height:34}},{title:{left:51,top:736.5,width:520,height:79},short:{left:54,top:835.5,width:500,height:34}}],dividers:[{left:60,top:620.8,width:105.5}]},
  3:{orbits:[{left:471,top:-83,width:560,height:560},{left:698,top:340,width:560,height:560},{left:471,top:763,width:560,height:560}],artworks:[{left:586,top:32,width:330,height:330},{left:813,top:455,width:330,height:330},{left:586,top:878,width:330,height:330}],glass:{left:-125,top:204,width:858,height:900,cut:125},rows:[{title:{left:50,top:304.5,width:600,height:79},short:{left:54,top:419,width:580,height:34}},{title:{left:50,top:596.7,width:600,height:79},short:{left:54,top:695.7,width:580,height:34}},{title:{left:50,top:865.7,width:600,height:79},short:{left:54,top:964.7,width:580,height:34}}],dividers:[{left:50,top:529,width:105.5},{left:50,top:798,width:105.5}]},
  4:{maxTitleSize:75,orbits:[{left:595,top:-43,width:395,height:395},{left:711,top:255,width:395,height:395},{left:595,top:554,width:395,height:395},{left:711,top:867,width:395,height:395}],artworks:[{left:676,top:38,width:232,height:233},{left:792,top:336,width:232,height:233},{left:676,top:635,width:232,height:232},{left:792,top:948,width:232,height:233}],glass:{left:-125,top:204,width:858,height:900,cut:125},rows:[{title:{left:50,top:286.5,width:520,height:72},short:{left:53.62,top:375.76,width:500,height:28}},{title:{left:50,top:493.2,width:520,height:72},short:{left:53.62,top:584.74,width:500,height:28}},{title:{left:50,top:707.6,width:520,height:72},short:{left:53.62,top:799.15,width:500,height:28}},{title:{left:50,top:916.6,width:520,height:72},short:{left:53.62,top:1008.13,width:500,height:28}}],dividers:[{left:53.62,top:449.84,width:95.483},{left:50,top:664.25,width:95.483},{left:50,top:884.09,width:95.483}]}
};
const blank=count=>Array.from({length:count},()=>({contractName:'',shortName:'',image:EMPTY,fileName:''}));
const defaults={language:'en',count:1,drafts:{1:blank(1)}};
let state=loadDraft(),scale=.5;
function contractTrack(event,params={}){try{parent.postMessage({source:'htx-analytics',event,params:{template:'contract-listing',...params}},location.origin)}catch(_){}}
function contractErrorCode(message){if(/仅支持/.test(message))return'IMAGE_TYPE_UNSUPPORTED';if(/10MB|存储空间/.test(message))return'IMAGE_TOO_LARGE';if(/下载组件/.test(message))return'DOWNLOAD_COMPONENT_MISSING';if(/生成|渲染/.test(message))return'CANVAS_RENDER_FAILED';return'OPERATION_FAILED'}
const titleMeasure=document.createElement('canvas').getContext('2d');
function esc(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function clone(value){return JSON.parse(JSON.stringify(value))}
function loadDraft(){try{const saved=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');if(!saved)return clone(defaults);const count=[1,2,3,4].includes(Number(saved.count))?Number(saved.count):1;return {language:saved.language==='zh'?'zh':'en',count,drafts:saved.drafts&&typeof saved.drafts==='object'?saved.drafts:{[count]:blank(count)}}}catch(_){return clone(defaults)}}
function saveDraft(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify(state))}catch(_){setStatus('图片已载入，但浏览器存储空间不足。',true)}}
function currentCoins(){if(!Array.isArray(state.drafts[state.count])||state.drafts[state.count].length!==state.count)state.drafts[state.count]=blank(state.count);return state.drafts[state.count]}
function style(position){return Object.entries(position).map(([key,value])=>`${key}:${value}px`).join(';')}
function baseName(value){return String(value||'').trim().replace(/\s+PERP$/i,'').replace(/\s+/g,' ').toUpperCase()}
function fittedTitleSize(value,maxWidth,maxHeight,maxSize,weight){const name=baseName(value)||' ';titleMeasure.font=`${weight} 100px Urbanist,Arial`;const measured=Math.max(titleMeasure.measureText(name).width,titleMeasure.measureText('PERP').width,1);const widthSize=maxWidth*100/measured;const heightSize=maxHeight/(2*.96);return Math.max(24,Math.min(maxSize,widthSize,heightSize))}
function fittedSingleLineSize(value,maxWidth,maxHeight,maxSize,weight){const title=baseName(value)?`${baseName(value)} PERP`:' ';titleMeasure.font=`${weight} 100px Urbanist,Arial`;const measured=Math.max(titleMeasure.measureText(title).width,1);const widthSize=maxWidth*100/measured;const heightSize=maxHeight/.96;return Math.max(24,Math.min(maxSize,widthSize,heightSize))}
function renderChoices(){document.getElementById('countChoices').innerHTML=[1,2,3,4].map(count=>`<button class="choice${state.count===count?' active':''}" data-count="${count}" type="button">${count} 个币</button>`).join('');document.getElementById('languageChoices').innerHTML=[['en','EN 英文'],['zh','ZH 简中']].map(([language,label])=>`<button class="choice${state.language===language?' active':''}" data-language="${language}" type="button">${label}</button>`).join('');document.querySelectorAll('[data-count]').forEach(button=>button.addEventListener('click',()=>{state.count=Number(button.dataset.count);currentCoins();saveDraft();contractTrack('layout_select',{coin_count:state.count});render()}));document.querySelectorAll('[data-language]').forEach(button=>button.addEventListener('click',()=>{state.language=button.dataset.language;saveDraft();contractTrack('language_select',{language:state.language});render()}))}
function renderEditors(){document.getElementById('coinEditors').innerHTML=currentCoins().map((coin,index)=>`<section class="coin-card"><div class="coin-title">币种 ${index+1}</div><label class="input-field"><span>合约名称（PERP 自动添加）</span><input data-field="contractName" data-index="${index}" maxlength="36" autocomplete="off" value="${esc(baseName(coin.contractName))}"></label><label class="input-field"><span>小字简称</span><input data-field="shortName" data-index="${index}" maxlength="64" autocomplete="off" value="${esc(coin.shortName)}"></label><span class="upload-label">币种 Logo</span><button class="upload" data-upload="${index}" type="button"><span class="upload-preview">${coin.image!==EMPTY?`<img src="${coin.image}" alt="">`:''}</span><span class="upload-copy">${coin.image!==EMPTY?'点击或拖拽替换币种图片':'点击或拖拽上传币种图片'}<small>PNG / JPG / SVG · 自动圆形裁切</small></span></button><input class="file" data-file="${index}" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"></section>`).join('');document.querySelectorAll('[data-field]').forEach(input=>input.addEventListener('input',()=>{const field=input.dataset.field;currentCoins()[Number(input.dataset.index)][field]=field==='contractName'?baseName(input.value):input.value;saveDraft();renderPoster()}));document.querySelectorAll('[data-upload]').forEach(button=>{const index=Number(button.dataset.upload),input=document.querySelector(`[data-file="${index}"]`);button.addEventListener('click',()=>input.click());['dragenter','dragover'].forEach(type=>button.addEventListener(type,event=>{event.preventDefault();button.classList.add('drag')}));['dragleave','drop'].forEach(type=>button.addEventListener(type,event=>{event.preventDefault();button.classList.remove('drag')}));button.addEventListener('drop',event=>applyFile(index,event.dataTransfer?.files?.[0]));input.addEventListener('change',event=>{applyFile(index,event.target.files?.[0]);event.target.value=''})})}
function applyFile(index,file){if(!file)return;const valid=['image/png','image/jpeg','image/webp','image/svg+xml'];if(!valid.includes(file.type)&&!/^.+\.(png|jpe?g|webp|svg)$/i.test(file.name)){setStatus('仅支持 PNG、JPG、WebP 或 SVG 图片。',true);return}if(file.size>10*1024*1024){setStatus('单张图片不能超过 10MB。',true);return}const reader=new FileReader();reader.onload=()=>{currentCoins()[index].image=String(reader.result);currentCoins()[index].fileName=file.name;saveDraft();renderEditors();renderPoster();contractTrack('upload_complete',{result:'success',asset_type:file.type||'unknown',coin_count:state.count});setStatus('草稿已自动保存。')};reader.onerror=()=>setStatus('图片读取失败，请重新选择。',true);reader.readAsDataURL(file)}
const posterImageCache=new Map();
let posterRenderVersion=0;
let posterRenderPromise=Promise.resolve(null);
let latestPosterCanvas=null;
function loadPosterImage(src){
  if(!src)return Promise.resolve(null);
  if(posterImageCache.has(src))return posterImageCache.get(src);
  const promise=new Promise(resolve=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>resolve(null);image.src=src});
  posterImageCache.set(src,promise);
  return promise;
}
function roundedRectPath(ctx,x,y,width,height,radius){ctx.beginPath();ctx.roundRect(x,y,width,height,radius)}
function drawPosterBackground(ctx){
  const angle=161.898*Math.PI/180;
  const vx=Math.sin(angle),vy=-Math.cos(angle),length=Math.abs(1080*vx)+Math.abs(1280*vy);
  const cx=540,cy=640;
  const gradient=ctx.createLinearGradient(cx-vx*length/2,cy-vy*length/2,cx+vx*length/2,cy+vy*length/2);
  gradient.addColorStop(0,'#FFFFFF');gradient.addColorStop(.29188,'#FFFFFF');gradient.addColorStop(1,'#2D82FA');
  ctx.fillStyle=gradient;ctx.fillRect(0,0,1080,1280);
}
function drawDotField(ctx,image){
  if(!image)return;
  const x=-8,y=81.5,width=1114.337,height=1324.5;
  ctx.save();ctx.translate(x+width/2,y+height/2);ctx.rotate(-Math.PI/2);ctx.scale(1,-1);ctx.globalAlpha=1;ctx.drawImage(image,-1324.5/2,-1114.337/2,1324.5,1114.337);ctx.restore();
}
function drawOrbit(ctx,position,index,count){
  const x=position.left,y=position.top,w=position.width,h=position.height;
  ctx.save();roundedRectPath(ctx,x,y,w,h,w/2);
  if(count===1){const gradient=ctx.createRadialGradient(x+w*.38,y+h*.34,w*.04,x+w*.5,y+h*.5,w*.62);gradient.addColorStop(0,'rgba(201,222,255,.72)');gradient.addColorStop(1,'rgba(255,255,255,.2)');ctx.fillStyle=gradient;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='rgba(188,201,220,.34)';ctx.stroke()}
  else{const fills={2:['#E2ECFA','#BFD5F4'],3:['#E9F1FC','#C8DBF7','#9FC2F1'],4:['#E5EEFB','#C8DBF7','#9FC2F1','#72A8EF']};ctx.fillStyle=fills[count][index];ctx.fill()}
  ctx.restore();
}
function drawCircleArtwork(ctx,image,position){
  if(!image)return;
  const x=position.left,y=position.top,w=position.width,h=position.height;
  const sourceRatio=image.naturalWidth/image.naturalHeight,targetRatio=w/h;
  let sx=0,sy=0,sw=image.naturalWidth,sh=image.naturalHeight;
  if(sourceRatio>targetRatio){sw=image.naturalHeight*targetRatio;sx=(image.naturalWidth-sw)/2}else{sh=image.naturalWidth/targetRatio;sy=(image.naturalHeight-sh)/2}
  ctx.save();roundedRectPath(ctx,x,y,w,h,w/2);ctx.clip();ctx.drawImage(image,sx,sy,sw,sh,x,y,w,h);ctx.restore();
}
function drawGlassPanel(ctx,glass){
  const x=glass.left,y=glass.top,w=glass.width,h=glass.height,r=37;
  const backdrop=document.createElement('canvas');backdrop.width=1080;backdrop.height=1280;backdrop.getContext('2d').drawImage(ctx.canvas,0,0);
  ctx.save();roundedRectPath(ctx,x,y,w,h,r);ctx.clip();ctx.filter='blur(14.5px)';ctx.globalAlpha=.92;ctx.drawImage(backdrop,0,0);ctx.filter='none';ctx.globalAlpha=1;
  const tint=ctx.createRadialGradient(x+w*.5,y-h*.08,0,x+w*.5,y-h*.08,Math.max(w,h)*1.2);tint.addColorStop(0,'rgba(255,255,255,.16)');tint.addColorStop(1,'rgba(169,203,255,.20)');ctx.fillStyle=tint;ctx.fillRect(x,y,w,h);
  ctx.globalAlpha=.035;ctx.fillStyle='#37404D';for(let py=y+3;py<y+h;py+=5)for(let px=x+3;px<x+w;px+=5)ctx.fillRect(px,py,.8,.8);ctx.restore();
  ctx.save();roundedRectPath(ctx,x,y,w,h,r);ctx.lineWidth=.731;ctx.strokeStyle='rgba(255,255,255,.42)';ctx.stroke();ctx.restore();
}
function drawPosterText(ctx,snapshot,layout){
  const coins=snapshot.coins;
  ctx.fillStyle='#000000';ctx.textAlign='left';ctx.textBaseline='middle';
  if(snapshot.count===1){
    const name=baseName(coins[0]?.contractName),size=fittedTitleSize(name,680,348,181.463,500),lineHeight=size*.96,centerY=526+348/2;
    ctx.font=`500 ${size}px Urbanist,Arial,sans-serif`;
    if(name){ctx.fillText(name,50,centerY-lineHeight/2);ctx.fillText('PERP',50,centerY+lineHeight/2)}
    ctx.fillStyle='#3B3B3B';ctx.font=`300 40px HTX-Harmony,"PingFang SC",Arial,sans-serif`;ctx.textBaseline='top';ctx.fillText(String(coins[0]?.shortName||''),60,centerY+size*.96+25);
  }else{
    coins.forEach((coin,index)=>{const row=layout.rows[index],name=baseName(coin.contractName),size=fittedSingleLineSize(name,row.title.width,row.title.height,layout.maxTitleSize||82.089,500);ctx.fillStyle='#000000';ctx.font=`500 ${size}px Urbanist,Arial,sans-serif`;ctx.textBaseline='middle';if(name)ctx.fillText(`${name} PERP`,row.title.left,row.title.top+row.title.height/2);const originalGap=row.short.top-(row.title.top+row.title.height),shortTop=row.title.top+row.title.height/2+size*.48+originalGap;ctx.fillStyle='#3B3B3B';ctx.font=`300 ${snapshot.count===4?28:34}px HTX-Harmony,"PingFang SC",Arial,sans-serif`;ctx.textBaseline='top';ctx.fillText(String(coin.shortName||''),row.short.left,shortTop)});
    ctx.fillStyle='rgba(0,0,0,.5)';layout.dividers.forEach(divider=>ctx.fillRect(divider.left,divider.top,divider.width,.6));
  }
  ctx.fillStyle='#000000';ctx.font='300 36px HTX-Harmony,"PingFang SC",Arial,sans-serif';ctx.textBaseline='top';const footer=snapshot.language==='zh'?'+ USDT本位永续合约 正式上线！':'+ USDT-Margined Perpetual Futures';ctx.fillText(footer,50,snapshot.count>=3?1169:1163);
}
async function buildPosterCanvas(snapshot){
  await document.fonts.ready;
  const layout=LAYOUTS[snapshot.count],canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1280;const ctx=canvas.getContext('2d');
  const artworkPromises=snapshot.coins.map(coin=>coin.image!==EMPTY?loadPosterImage(coin.image):Promise.resolve(null));
  const [dots,brand,artworks]=await Promise.all([loadPosterImage('./assets/background-vector.svg'),loadPosterImage('./assets/brand-mark.svg'),Promise.all(artworkPromises)]);
  drawPosterBackground(ctx);drawDotField(ctx,dots);layout.orbits.forEach((orbit,index)=>drawOrbit(ctx,orbit,index,snapshot.count));artworks.forEach((image,index)=>drawCircleArtwork(ctx,image,layout.artworks[index]));drawGlassPanel(ctx,layout.glass);drawPosterText(ctx,snapshot,layout);if(brand)ctx.drawImage(brand,50,50,90,90);
  return canvas;
}
function renderPoster(){
  const poster=document.getElementById('poster'),version=++posterRenderVersion,snapshot={language:state.language,count:state.count,coins:clone(currentCoins())};
  poster.className=`poster count-${state.count}`;
  poster.innerHTML='<canvas class="poster-canvas" width="1080" height="1280" aria-label="合约上币海报"></canvas>';
  document.getElementById('previewMeta').textContent=`${state.language==='zh'?'中文':'英文'} · ${state.count} 币 · 1080 × 1280 · 同步渲染 v2`;
  const visibleCanvas=poster.querySelector('.poster-canvas');
  posterRenderPromise=buildPosterCanvas(snapshot).then(canvas=>{if(version!==posterRenderVersion)return latestPosterCanvas;visibleCanvas.getContext('2d').drawImage(canvas,0,0);latestPosterCanvas=canvas;return canvas});
}
function updateScale(){const stage=document.getElementById('stage');scale=Math.max(.12,Math.min((stage.clientWidth-60)/1080,(stage.clientHeight-30)/1280,1));const mount=document.getElementById('posterMount');mount.style.width=`${1080*scale}px`;mount.style.height=`${1280*scale}px`;document.getElementById('poster').style.transform=`scale(${scale})`}
function render(){renderChoices();renderEditors();renderPoster()}
function setStatus(message,error=false){const node=document.getElementById('status');node.textContent=message;node.style.color=error?'#d92d20':'#98a2b3';if(error)contractTrack('operation_error',{result:'failed',error_stage:'contract_listing',error_code:contractErrorCode(message),error_detail:String(message)})}
async function downloadPoster(){const button=document.getElementById('download');button.disabled=true;button.textContent='正在生成…';setStatus('正在生成海报…');contractTrack('download_start',{language:state.language,coin_count:state.count});try{await posterRenderPromise;const canvas=document.querySelector('.poster-canvas');if(!(canvas instanceof HTMLCanvasElement))throw new Error('海报尚未生成，请稍后重试。');const link=document.createElement('a');link.download=`contract-listing-${state.language}-${state.count}-coin-wysiwyg-v2.png`;link.href=canvas.toDataURL('image/png');link.click();contractTrack('download_complete',{result:'success',language:state.language,coin_count:state.count});setStatus('海报已生成（同步渲染 v2）。')}catch(error){setStatus(error.message||'下载失败，请重试。',true)}finally{button.disabled=false;button.textContent='下载'}}
document.getElementById('clearDraft').addEventListener('click',()=>{state.drafts[state.count]=blank(state.count);saveDraft();render();setStatus('当前版式草稿已清空。')});document.getElementById('download').addEventListener('click',downloadPoster);window.addEventListener('resize',updateScale);window.addEventListener('pagehide',saveDraft);contractTrack('template_view',{language:state.language,coin_count:state.count});render();document.fonts.ready.finally(()=>{updateScale();document.body.classList.add('ready')});
</script>
