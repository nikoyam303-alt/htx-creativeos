<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTX 合约上币海报</title>
<style>
@font-face{font-family:Urbanist;src:url("./assets/Urbanist-Variable.ttf") format("truetype");font-weight:100 900;font-display:swap}
@font-face{font-family:HTX-Harmony;src:url("./assets/HarmonyOS-Sans-SC-Light.ttf") format("truetype");font-weight:300;font-display:swap}
*{box-sizing:border-box}html{background:#f4f6fa;color:#101828;font-family:HTX-Harmony,"PingFang SC",Arial,sans-serif}body{margin:0;min-height:100vh;padding:0;background:#f4f6fa;opacity:0;transition:opacity .16s ease}body.ready{opacity:1}button,input{font:inherit}
.workbench{display:grid;grid-template-columns:390px minmax(0,1fr);gap:20px;width:100%;height:100vh;min-height:820px;margin:0;align-items:stretch}
.panel{height:100%;min-height:0;overflow:auto;padding:20px;border:1px solid #e4e7ec;border-radius:14px;background:#fff}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}.eyebrow{color:#98a2b3;font-size:11px;letter-spacing:.04em}.panel-subtitle{margin-top:5px;color:#b0b7c1;font-size:10px}.clear{border:0;border-radius:6px;padding:7px 10px;background:#f4f6f8;color:#7c899b;font-size:11px;cursor:pointer}
.field{margin-bottom:18px}.field-label{display:block;margin-bottom:8px;color:#667085;font-size:11px}.choices{display:flex;flex-wrap:wrap;gap:7px}.choice{height:30px;padding:0 12px;border:0;border-radius:6px;color:#667085;background:#f2f4f7;font-size:11px;font-weight:600;cursor:pointer}.choice.active{color:#1677ff;background:#edf5ff}
.coin-list{display:grid;gap:12px}.coin-card{padding:14px;border:1px solid #e4e7ec;border-radius:10px;background:#fff}.coin-title{margin-bottom:11px;color:#344054;font-size:12px;font-weight:600}.input-field{display:block;margin-bottom:11px}.input-field span,.upload-label{display:block;margin-bottom:6px;color:#667085;font-size:10px}.input-field input{width:100%;height:38px;padding:0 10px;border:1px solid #dde3ea;border-radius:7px;color:#111827;background:#fff;outline:none}.input-field input:focus{border-color:#0066ff;box-shadow:0 0 0 3px rgba(0,102,255,.08)}
.upload{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:6px 9px;border:1px dashed #d5dde8;border-radius:8px;color:#1677ff;background:#edf5ff;font-size:10px;font-weight:600;cursor:pointer;text-align:left}.upload.drag{border-color:#1677ff;background:#e2efff}.upload-preview{width:34px;height:34px;overflow:hidden;border-radius:50%;background:#dfe8f6;flex:0 0 auto}.upload-preview img{width:100%;height:100%;object-fit:cover}.upload-copy small{display:block;margin-top:3px;color:#8a96a7;font-size:8px;font-weight:400}.file{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0}
.status{min-height:16px;margin:12px 0 8px;color:#98a2b3;font-size:9px}.download{width:100%;height:40px;border:0;border-radius:7px;color:#fff;background:#0066ff;font-size:12px;font-weight:700;cursor:pointer}.download:disabled{opacity:.55;cursor:wait}
.preview{min-width:0;height:100%;min-height:0;display:grid;grid-template-rows:62px minmax(0,1fr);border:1px solid #dde3ea;border-radius:12px;background:#f7f9fc;overflow:hidden}.preview-head{display:flex;align-items:center;justify-content:space-between;height:62px;padding:0 26px;color:#98a2b3;font-size:11px}.stage{display:grid;place-items:center;min-height:0;padding:18px 30px 24px;overflow:hidden}.poster-mount{position:relative;box-shadow:0 24px 60px rgba(16,24,40,.15)}
.poster{position:absolute;left:0;top:0;width:1080px;height:1280px;overflow:hidden;transform-origin:top left;color:#000;background:linear-gradient(161.898deg,#fff 29.188%,#0066ff 133.83%);isolation:isolate}
.dot-field{position:absolute;left:-8px;bottom:-126px;width:1114.337px;height:1324.5px;display:flex;align-items:center;justify-content:center;z-index:1}.dot-field-inner{width:1324.5px;height:1114.337px;transform:rotate(-90deg) scaleY(-1)}.dot-field img{display:block;width:100%;height:100%}
.orbit,.artwork{position:absolute;border-radius:50%}.orbit{z-index:2}.count-2 .orbit-1{background:#e2ecfa}.count-2 .orbit-2{background:#bfd5f4}.count-3 .orbit-1{background:#e9f1fc}.count-3 .orbit-2{background:#c8dbf7}.count-3 .orbit-3{background:#9fc2f1}.count-4 .orbit-1{background:#e5eefb}.count-4 .orbit-2{background:#c8dbf7}.count-4 .orbit-3{background:#9fc2f1}.count-4 .orbit-4{background:#72a8ef}.artwork{z-index:3;object-fit:cover;object-position:center;clip-path:circle(50% at 50% 50%)}
.glass{position:absolute;overflow:hidden;border:.731px solid rgba(255,255,255,.42);border-radius:37px;background:radial-gradient(ellipse 72% 135% at 50% -8%,rgba(255,255,255,.08),rgba(169,203,255,.13) 95.49%);box-shadow:0 32px 24px rgba(117,172,255,.38),inset 0 -9px 15px -11px rgba(255,255,255,.46);backdrop-filter:blur(14.5px);-webkit-backdrop-filter:blur(14.5px);z-index:4}.glass:before{content:"";position:absolute;inset:0;opacity:.075;background-image:radial-gradient(circle,rgba(55,64,77,.9) 0 .55px,transparent .75px),radial-gradient(circle,rgba(255,255,255,.7) 0 .45px,transparent .7px),radial-gradient(circle,rgba(36,47,66,.65) 0 .45px,transparent .65px);background-position:0 0,1.3px .7px,.5px 1.4px;background-size:2.2px 2.2px,2.7px 2.7px,3.1px 3.1px;mix-blend-mode:overlay}
.brand{position:absolute;left:50px;top:50px;width:90px;height:90px;z-index:6}.single-title{position:absolute;left:50px;top:526px;width:680px;height:348px;display:flex;flex-direction:column;justify-content:center;color:#000;font-family:Urbanist,Arial,sans-serif;font-size:181.463px;font-weight:500;line-height:.96;letter-spacing:-.045em;text-transform:uppercase;white-space:nowrap;z-index:5}.single-title span,.multi-title span{display:block}.single-short{position:absolute;left:60px;top:899px;color:#3b3b3b;font-size:40px;font-weight:300;white-space:nowrap;z-index:5}.multi-title{position:absolute;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;color:#000;font-family:Urbanist,Arial,sans-serif;font-size:41px;font-weight:500;line-height:.96;letter-spacing:-.025em;text-transform:uppercase;white-space:nowrap;z-index:5}.multi-short{position:absolute;display:flex;align-items:center;color:#3b3b3b;font-size:34px;font-weight:300;white-space:nowrap;z-index:5}.count-4 .multi-short{font-size:28px}.divider{position:absolute;height:.6px;background:rgba(0,0,0,.5);z-index:5}.poster-footer{position:absolute;left:50px;top:1163px;width:650px;height:44px;font-size:36px;font-weight:300;line-height:1.21;white-space:nowrap;z-index:6}.count-3 .poster-footer,.count-4 .poster-footer{top:1169px}
@media(max-width:720px){body{padding:14px}.workbench{grid-template-columns:1fr;height:auto}.panel{height:auto;max-height:none}.preview{height:700px}.stage{min-height:0}}@media(max-width:520px){body{padding:8px}.preview{height:580px}.stage{padding:12px}.preview-head{padding:0 14px}}
</style>
</head>
<body>
<main class="workbench">
  <aside class="panel" aria-label="合约上币配置">
    <div class="panel-head"><div><div class="eyebrow">文案配置</div><div class="panel-subtitle">合约上币 · 社媒海报</div></div><button class="clear" id="clearDraft" type="button">清空草稿</button></div>
    <div class="field"><span class="field-label">版式数量</span><div class="choices" id="countChoices"></div></div>
    <div class="field"><span class="field-label">语言版本</span><div class="choices" id="languageChoices"></div></div>
    <div class="coin-list" id="coinEditors"></div>
    <div class="status" id="status">文字与图片仅保存在当前浏览器。</div>
    <button class="download" id="download" type="button">下载</button>
  </aside>
  <section class="preview" aria-label="海报预览">
    <div class="preview-head"><span>合约上币海报预览</span><span id="previewMeta">英文 · 1 币 · 1080 × 1280</span></div>
    <div class="stage" id="stage"><div class="poster-mount" id="posterMount"><article class="poster count-1" id="poster"></article></div></div>
  </section>
</main>
<script src="./assets/html2canvas.min.js"></script>
<script>
const EMPTY='data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
const DRAFT_KEY='htx-contract-listing-v1';
const LAYOUTS={
  1:{orbits:[{left:473,top:50,width:600,height:600}],artworks:[{left:573,top:150,width:400,height:400}],glass:{left:-68,top:397,width:846,height:700,cut:68},rows:[],dividers:[]},
  2:{orbits:[{left:620,top:119,width:540,height:540},{left:620,top:586,width:540,height:537}],artworks:[{left:712,top:211,width:357,height:357},{left:712,top:676,width:357,height:357}],glass:{left:-125,top:229,width:858,height:820,cut:125},rows:[{title:{left:51,top:364,width:520,height:79},short:{left:60,top:478.5,width:500,height:34}},{title:{left:51,top:736.5,width:520,height:79},short:{left:54,top:835.5,width:500,height:34}}],dividers:[{left:60,top:620.8,width:105.5}]},
  3:{orbits:[{left:471,top:-83,width:560,height:560},{left:698,top:340,width:560,height:560},{left:471,top:763,width:560,height:560}],artworks:[{left:586,top:32,width:330,height:330},{left:813,top:455,width:330,height:330},{left:586,top:878,width:330,height:330}],glass:{left:-125,top:204,width:858,height:900,cut:125},rows:[{title:{left:50,top:304.5,width:600,height:79},short:{left:54,top:419,width:580,height:34}},{title:{left:50,top:596.7,width:600,height:79},short:{left:54,top:695.7,width:580,height:34}},{title:{left:50,top:865.7,width:600,height:79},short:{left:54,top:964.7,width:580,height:34}}],dividers:[{left:50,top:529,width:105.5},{left:50,top:798,width:105.5}]},
  4:{maxTitleSize:75,orbits:[{left:595,top:-43,width:395,height:395},{left:711,top:255,width:395,height:395},{left:595,top:554,width:395,height:395},{left:711,top:867,width:395,height:395}],artworks:[{left:676,top:38,width:232,height:233},{left:792,top:336,width:232,height:233},{left:676,top:635,width:232,height:232},{left:792,top:948,width:232,height:233}],glass:{left:-125,top:204,width:858,height:900,cut:125},rows:[{title:{left:50,top:286.5,width:520,height:72},short:{left:53.62,top:375.76,width:500,height:28}},{title:{left:50,top:493.2,width:520,height:72},short:{left:53.62,top:584.74,width:500,height:28}},{title:{left:50,top:707.6,width:520,height:72},short:{left:53.62,top:799.15,width:500,height:28}},{title:{left:50,top:916.6,width:520,height:72},short:{left:53.62,top:1008.13,width:500,height:28}}],dividers:[{left:53.62,top:449.84,width:95.483},{left:50,top:664.25,width:95.483},{left:50,top:884.09,width:95.483}]}
};
const blank=count=>Array.from({length:count},()=>({contractName:'',shortName:'',image:EMPTY,fileName:''}));
const defaults={language:'en',count:1,drafts:{1:blank(1)}};
let state=loadDraft(),scale=.5;
const titleMeasure=document.createElement('canvas').getContext('2d');
function esc(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function clone(value){return JSON.parse(JSON.stringify(value))}
function loadDraft(){try{const saved=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');if(!saved)return clone(defaults);const count=[1,2,3,4].includes(Number(saved.count))?Number(saved.count):1;return {language:saved.language==='zh'?'zh':'en',count,drafts:saved.drafts&&typeof saved.drafts==='object'?saved.drafts:{[count]:blank(count)}}}catch(_){return clone(defaults)}}
function saveDraft(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify(state))}catch(_){setStatus('图片已载入，但浏览器存储空间不足。',true)}}
function currentCoins(){if(!Array.isArray(state.drafts[state.count])||state.drafts[state.count].length!==state.count)state.drafts[state.count]=blank(state.count);return state.drafts[state.count]}
function style(position){return Object.entries(position).map(([key,value])=>`${key}:${value}px`).join(';')}
function baseName(value){return String(value||'').trim().replace(/\s+PERP$/i,'').replace(/\s+/g,' ').toUpperCase()}
function fittedTitleSize(value,maxWidth,maxHeight,maxSize,weight){const name=baseName(value)||' ';titleMeasure.font=`${weight} 100px Urbanist,Arial`;const measured=Math.max(titleMeasure.measureText(name).width,titleMeasure.measureText('PERP').width,1);const widthSize=maxWidth*100/measured;const heightSize=maxHeight/(2*.96);return Math.max(24,Math.min(maxSize,widthSize,heightSize))}
function fittedSingleLineSize(value,maxWidth,maxHeight,maxSize,weight){const title=baseName(value)?`${baseName(value)} PERP`:' ';titleMeasure.font=`${weight} 100px Urbanist,Arial`;const measured=Math.max(titleMeasure.measureText(title).width,1);const widthSize=maxWidth*100/measured;const heightSize=maxHeight/.96;return Math.max(24,Math.min(maxSize,widthSize,heightSize))}
function renderChoices(){document.getElementById('countChoices').innerHTML=[1,2,3,4].map(count=>`<button class="choice${state.count===count?' active':''}" data-count="${count}" type="button">${count} 个币</button>`).join('');document.getElementById('languageChoices').innerHTML=[['en','EN 英文'],['zh','ZH 简中']].map(([language,label])=>`<button class="choice${state.language===language?' active':''}" data-language="${language}" type="button">${label}</button>`).join('');document.querySelectorAll('[data-count]').forEach(button=>button.addEventListener('click',()=>{state.count=Number(button.dataset.count);currentCoins();saveDraft();render()}));document.querySelectorAll('[data-language]').forEach(button=>button.addEventListener('click',()=>{state.language=button.dataset.language;saveDraft();render()}))}
function renderEditors(){document.getElementById('coinEditors').innerHTML=currentCoins().map((coin,index)=>`<section class="coin-card"><div class="coin-title">币种 ${index+1}</div><label class="input-field"><span>合约名称（PERP 自动添加）</span><input data-field="contractName" data-index="${index}" maxlength="36" autocomplete="off" value="${esc(baseName(coin.contractName))}"></label><label class="input-field"><span>小字简称</span><input data-field="shortName" data-index="${index}" maxlength="64" autocomplete="off" value="${esc(coin.shortName)}"></label><span class="upload-label">币种 Logo</span><button class="upload" data-upload="${index}" type="button"><span class="upload-preview">${coin.image!==EMPTY?`<img src="${coin.image}" alt="">`:''}</span><span class="upload-copy">${coin.image!==EMPTY?'点击或拖拽替换币种图片':'点击或拖拽上传币种图片'}<small>PNG / JPG / SVG · 自动圆形裁切</small></span></button><input class="file" data-file="${index}" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"></section>`).join('');document.querySelectorAll('[data-field]').forEach(input=>input.addEventListener('input',()=>{const field=input.dataset.field;currentCoins()[Number(input.dataset.index)][field]=field==='contractName'?baseName(input.value):input.value;saveDraft();renderPoster()}));document.querySelectorAll('[data-upload]').forEach(button=>{const index=Number(button.dataset.upload),input=document.querySelector(`[data-file="${index}"]`);button.addEventListener('click',()=>input.click());['dragenter','dragover'].forEach(type=>button.addEventListener(type,event=>{event.preventDefault();button.classList.add('drag')}));['dragleave','drop'].forEach(type=>button.addEventListener(type,event=>{event.preventDefault();button.classList.remove('drag')}));button.addEventListener('drop',event=>applyFile(index,event.dataTransfer?.files?.[0]));input.addEventListener('change',event=>{applyFile(index,event.target.files?.[0]);event.target.value=''})})}
function applyFile(index,file){if(!file)return;const valid=['image/png','image/jpeg','image/webp','image/svg+xml'];if(!valid.includes(file.type)&&!/^.+\.(png|jpe?g|webp|svg)$/i.test(file.name)){setStatus('仅支持 PNG、JPG、WebP 或 SVG 图片。',true);return}if(file.size>10*1024*1024){setStatus('单张图片不能超过 10MB。',true);return}const reader=new FileReader();reader.onload=()=>{currentCoins()[index].image=String(reader.result);currentCoins()[index].fileName=file.name;saveDraft();renderEditors();renderPoster();setStatus('草稿已自动保存。')};reader.readAsDataURL(file)}
function renderPoster(){const coins=currentCoins(),layout=LAYOUTS[state.count],footer=state.language==='zh'?'+ USDT本位永续合约 正式上线！':'+ USDT-Margined Perpetual Futures';let visuals='';coins.forEach((coin,index)=>{const orbit=state.count===1?`<img class="orbit" src="./assets/coin-orbit.svg" style="${style(layout.orbits[index])}" alt="">`:`<div class="orbit orbit-${index+1}" style="${style(layout.orbits[index])}"></div>`;const artwork=coin.image!==EMPTY?`<img class="artwork" src="${coin.image}" style="${style(layout.artworks[index])}" alt="">`:'';visuals+=orbit+artwork});let copy='';if(state.count===1){const name=baseName(coins[0]?.contractName),size=fittedTitleSize(name,680,348,181.463,500),title=name?`<span>${esc(name)}</span><span>PERP</span>`:'',shortTop=526+348/2+size*.96+25;copy=`<div class="single-title" style="font-size:${size}px">${title}</div><div class="single-short" style="top:${shortTop}px">${esc(coins[0]?.shortName)}</div>`}else{copy=coins.map((coin,index)=>{const row=layout.rows[index],name=baseName(coin.contractName),size=fittedSingleLineSize(name,row.title.width,row.title.height,layout.maxTitleSize||82.089,500),title=name?`<span>${esc(name)} PERP</span>`:'',originalGap=row.short.top-(row.title.top+row.title.height),shortTop=row.title.top+row.title.height/2+size*.48+originalGap;return `<div class="multi-title" style="${style(row.title)};font-size:${size}px">${title}</div><div class="multi-short" style="${style({...row.short,top:shortTop})}">${esc(coin.shortName)}</div>`}).join('')+layout.dividers.map(divider=>`<div class="divider" style="${style(divider)}"></div>`).join('')}document.getElementById('poster').className=`poster count-${state.count}`;document.getElementById('poster').innerHTML=`<div class="dot-field"><div class="dot-field-inner"><img src="./assets/background-vector.svg" alt=""></div></div>${visuals}<div class="glass" style="${style(layout.glass)}"></div>${copy}<img class="brand" src="./assets/brand-mark.svg" alt="HTX"><div class="poster-footer">${footer}</div>`;document.getElementById('previewMeta').textContent=`${state.language==='zh'?'中文':'英文'} · ${state.count} 币 · 1080 × 1280`}
function updateScale(){const stage=document.getElementById('stage');scale=Math.max(.12,Math.min((stage.clientWidth-60)/1080,(stage.clientHeight-30)/1280,1));const mount=document.getElementById('posterMount');mount.style.width=`${1080*scale}px`;mount.style.height=`${1280*scale}px`;document.getElementById('poster').style.transform=`scale(${scale})`}
function render(){renderChoices();renderEditors();renderPoster()}
function setStatus(message,error=false){const node=document.getElementById('status');node.textContent=message;node.style.color=error?'#d92d20':'#98a2b3'}
async function downloadPoster(){const button=document.getElementById('download');button.disabled=true;button.textContent='正在生成…';setStatus('正在生成海报…');try{await document.fonts.ready;const capture=parent.html2canvas||window.html2canvas;if(!capture)throw new Error('下载组件尚未加载，请刷新后重试。');const poster=document.getElementById('poster'),previous=poster.style.transform;poster.style.transform='none';const canvas=await capture(poster,{width:1080,height:1280,scale:1,useCORS:true,backgroundColor:null});poster.style.transform=previous;const link=document.createElement('a');link.download=`contract-listing-${state.language}-${state.count}-coin.png`;link.href=canvas.toDataURL('image/png');link.click();setStatus('海报已生成。')}catch(error){setStatus(error.message||'下载失败，请重试。',true)}finally{button.disabled=false;button.textContent='下载'}}
document.getElementById('clearDraft').addEventListener('click',()=>{state.drafts[state.count]=blank(state.count);saveDraft();render();setStatus('当前版式草稿已清空。')});document.getElementById('download').addEventListener('click',downloadPoster);window.addEventListener('resize',updateScale);window.addEventListener('pagehide',saveDraft);render();document.fonts.ready.finally(()=>{updateScale();document.body.classList.add('ready')});
</script>
</body>
</html>
